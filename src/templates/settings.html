{% extends 'base.html' %}{% block title %}系统设置 · Image Hosting{% endblock %}{% block content %}
<a class="back" href="{{ url_for('dashboard') }}">← 返回项目列表</a><div class="heading"><div><p class="eyebrow">服务配置</p><h1>系统设置</h1><p>所有设置均保存在 SQLite 数据库中。</p></div></div>
<section class="panel"><form class="settings-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>公开访问基地址<input name="public_base_url" type="url" value="{{ public_base_url }}" placeholder="https://images.example.com"><small>配置公网域名后，管理端复制的链接和 API 返回 URL 将使用此地址。</small></label><label>附加访问主机名<input name="extra_trusted_hosts" value="{{ extra_trusted_hosts }}" placeholder="192.168.1.5 nas.lan"><small>填了公开访问基地址后，服务默认只接受该域名的请求；同机或局域网里按 IP 直连调用 API 会被拒绝。把那些地址填在这里（空格或逗号分隔，可省略端口）。</small></label><label>单文件上传上限（MB）<input name="max_upload_mb" type="number" min="1" max="1024" value="{{ max_upload_mb }}" required></label><hr><h2>修改管理员密码</h2><p class="hint">留空则保持当前密码；新密码至少 8 个字符。</p><label>新密码<input name="password" type="password" autocomplete="new-password"></label><label>确认新密码<input name="password_confirm" type="password" autocomplete="new-password"></label><button>保存设置</button></form></section>
{% endblock %}
